<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delayed Message App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <h1>
        <i class="fa-regular fa-clock"></i>
        <span>Delayed Message App</span>
    </h1>

    <div class="controls">
        <input type="text" id="msgInput" placeholder="Enter Your Message">

        <select name="" id="delay">
            <option value="1000">1 second</option>
            <option value="2000">2 second</option>
            <option value="3000">3 second</option>
        </select>

        <button id="showbtn">Show Message </button>
    </div>

    <p id="output">Your message will appear here ....</p>






    <script src="app.js"></script>
</body>

</html>
